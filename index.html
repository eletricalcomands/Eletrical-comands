<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELECTRICAL COMMANDS</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #10b981;
            --bg: #0c3328;
            --card: #164235;
            --text: #ffffff;
            --accent: #3b82f6;
            --warning: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        header { text-align: center; padding: 25px 10px; }
        header img { width: 60px; margin-bottom: 5px; }
        header h1 { font-size: 1.3rem; margin: 0; color: var(--primary); letter-spacing: 1px; text-transform: uppercase; }

        .container {
            width: 92%;
            max-width: 450px;
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            margin-bottom: 25px;
        }

        h2 { font-size: 0.9rem; text-transform: uppercase; color: var(--primary); margin-bottom: 15px; border-bottom: 1px solid rgba(16,185,129,0.2); padding-bottom: 5px; }

        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 0.75rem; opacity: 0.9; font-weight: bold; }
        
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0c3328;
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .row { display: flex; gap: 10px; }
        .row .input-group { flex: 1; }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-register { background: var(--primary); color: #0c3328; margin-top: 10px; }
        .btn-portal { background: transparent; border: 2px solid var(--accent); color: var(--accent); margin-top: 10px; }

        /* Estilo da Listagem */
        .list-container { width: 92%; max-width: 480px; }
        .usina-card {
            background: var(--card);
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 15px;
            border-left: 5px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card-header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 10px; }
        .card-header h3 { margin: 0; font-size: 1rem; color: #fff; }
        
        .section-title { font-size: 0.65rem; text-transform: uppercase; color: var(--primary); font-weight: bold; margin-bottom: 5px; display: block; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
        .data-item p { margin: 0; font-size: 0.85rem; font-weight: bold; }
        .data-item small { font-size: 0.65rem; opacity: 0.6; display: block; text-transform: uppercase; }

        .date-footer { margin-top: 10px; font-size: 0.65rem; opacity: 0.5; font-style: italic; display: flex; justify-content: space-between; align-items: center; }
        
        .actions { display: flex; gap: 15px; }
        .btn-action { background: transparent; border: none; font-size: 0.65rem; cursor: pointer; text-decoration: underline; padding: 0; font-weight: bold; text-transform: uppercase; }
        .btn-edit { color: var(--accent); }
        .btn-delete { color: #ff4444; }
    </style>
</head>
<body>

    <header>
        <img src="web-app-manifest-192x192.png" alt="EC Logo">
        <h1>ELECTRICAL COMMANDS</h1>
    </header>

    <div class="container">
        <h2 id="formTitle">Dados do Inversor (Fixos)</h2>
        <form id="commandForm">
            <input type="hidden" id="editIndex" value="-1">
            
            <div class="input-group">
                <label>Cliente / Usina</label>
                <input type="text" id="clientName" required placeholder="Ex: Sítio Pôr do Sol">
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Marca</label>
                    <select id="inverterBrand">
                        <option value="SUNGROW">SUNGROW</option>
                        <option value="GROWATT">GROWATT</option>
                        <option value="WEG">WEG</option>
                        <option value="FOX">FOX ESS</option>
                        <option value="SOLIS">SOLIS</option>
                        <option value="SAJ">SAJ</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Nº de Série (S/N)</label>
                    <input type="text" id="serialNumber" required placeholder="S/N do Equipamento">
                </div>
            </div>

            <h2 style="margin-top: 20px;">Detalhes da Medição (Variáveis)</h2>
            <div class="row">
                <div class="input-group">
                    <label>Geração (kWh)</label>
                    <input type="number" id="generation" step="0.1" placeholder="0.0">
                </div>
                <div class="input-group">
                    <label>Uptime/Status</label>
                    <input type="text" id="uptime" placeholder="Ex: 1200h">
                </div>
            </div>

            <button type="submit" id="mainBtn" class="btn-register">Salvar Registro Completo</button>
            <button type="button" class="btn-portal" onclick="abrirPortal()">🌐 Abrir Portal da Marca</button>
        </form>
    </div>

    <div class="list-container" id="usinaList"></div>

    <script>
        const portalLinks = {
            'SUNGROW': 'https://www.isolarcloud.com/',
            'GROWATT': 'https://server.growatt.com/',
            'WEG': 'https://home.v2.weg-v-net.com/',
            'FOX': 'https://www.foxesscloud.com/',
            'SOLIS': 'https://www.soliscloud.com/',
            'SAJ': 'https://www.saj-electric.com/'
        };

        function abrirPortal() {
            const marca = document.getElementById('inverterBrand').value;
            window.open(portalLinks[marca], '_blank');
        }

        const form = document.getElementById('commandForm');
        const list = document.getElementById('usinaList');
        const mainBtn = document.getElementById('mainBtn');
        const formTitle = document.getElementById('formTitle');
        const editIndexInput = document.getElementById('editIndex');

        function loadUsinas() {
            const usinas = JSON.parse(localStorage.getItem('usinas_v2') || '[]');
            list.innerHTML = '<h2 style="text-align:center">Histórico Técnico</h2>';
            
            // Usamos uma cópia para inverter sem perder a referência do índice original
            const displayUsinas = [...usinas].reverse();

            displayUsinas.forEach((u, displayIndex) => {
                // O índice original no array 'usinas'
                const originalIndex = usinas.length - 1 - displayIndex;
                
                list.innerHTML += `
                    <div class="usina-card">
                        <div class="card-header">
                            <h3>${u.nome}</h3>
                            <span style="color:var(--primary); font-size:0.7rem; font-weight:bold">${u.marca}</span>
                        </div>
                        
                        <span class="section-title">Registro do Inversor</span>
                        <div class="data-grid" style="margin-bottom:10px">
                            <div class="data-item"><small>Marca</small><p>${u.marca}</p></div>
                            <div class="data-item"><small>Nº de Série</small><p>${u.sn}</p></div>
                        </div>

                        <span class="section-title">Detalhes da Geração</span>
                        <div class="data-grid">
                            <div class="data-item"><small>Total Gerado</small><p style="color:var(--warning)">${u.geracao} kWh</p></div>
                            <div class="data-item"><small>Tempo de Atividade</small><p>${u.tempo}</p></div>
                        </div>

                        <div class="date-footer">
                            <span>📅 ${u.data}</span>
                            <div class="actions">
                                <button class="btn-action btn-edit" onclick="editarUsina(${originalIndex})">Editar</button>
                                <button class="btn-action btn-delete" onclick="removerUsina(${originalIndex})">Excluir</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const agora = new Date();
            const dataFormatada = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

            const dadosUsina = {
                nome: document.getElementById('clientName').value,
                marca: document.getElementById('inverterBrand').value,
                sn: document.getElementById('serialNumber').value,
                geracao: document.getElementById('generation').value || '0',
                tempo: document.getElementById('uptime').value || 'N/A',
                data: dataFormatada
            };

            let usinas = JSON.parse(localStorage.getItem('usinas_v2') || '[]');
            const index = parseInt(editIndexInput.value);

            if (index === -1) {
                // Novo registro
                usinas.push(dadosUsina);
            } else {
                // Atualizando registro existente
                usinas[index] = dadosUsina;
                // Reseta o estado do formulário
                editIndexInput.value = "-1";
                mainBtn.innerText = "Salvar Registro Completo";
                mainBtn.style.background = "var(--primary)";
                formTitle.innerText = "Dados do Inversor (Fixos)";
            }

            localStorage.setItem('usinas_v2', JSON.stringify(usinas));
            form.reset();
            loadUsinas();
        });

        function editarUsina(index) {
            const usinas = JSON.parse(localStorage.getItem('usinas_v2') || '[]');
            const u = usinas[index];

            // Preenche o formulário
            document.getElementById('clientName').value = u.nome;
            document.getElementById('inverterBrand').value = u.marca;
            document.getElementById('serialNumber').value = u.sn;
            document.getElementById('generation').value = u.geracao;
            document.getElementById('uptime').value = u.tempo;
            
            // Configura para o modo de edição
            editIndexInput.value = index;
            mainBtn.innerText = "Atualizar Registro";
            mainBtn.style.background = "var(--accent)";
            formTitle.innerText = "Editando Registro";

            // Sobe a tela para o formulário
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function removerUsina(index) {
            if(confirm("Excluir este registro técnico?")) {
                const usinas = JSON.parse(localStorage.getItem('usinas_v2') || '[]');
                usinas.splice(index, 1);
                localStorage.setItem('usinas_v2', JSON.stringify(usinas));
                loadUsinas();
            }
        }

        loadUsinas();
    </script>
</body>
</html>
