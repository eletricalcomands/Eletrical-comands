<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC Commands - Gestão</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #10b981;
            --bg: #0c3328;
            --card: #164235;
            --text: #ffffff;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }

        header { text-align: center; padding: 25px 10px; }
        header img { width: 80px; margin-bottom: 10px; }
        header h1 { font-size: 1.4rem; margin: 0; letter-spacing: 2px; }
        header p { font-size: 0.8rem; opacity: 0.7; margin: 5px 0; }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 25px;
        }

        h2 { color: var(--primary); font-size: 1.1rem; border-left: 4px solid var(--primary); padding-left: 10px; margin-bottom: 20px; }

        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: var(--primary); font-weight: bold; }
        
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0c3328;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .row { display: flex; gap: 10px; }
        .row .input-group { flex: 1; }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-register { background: var(--primary); color: white; }
        .btn-portal { background: var(--accent); color: white; margin-top: 5px; }
        button:active { transform: scale(0.95); }

        /* Estilo da Tabela/Lista */
        .list-container { width: 95%; max-width: 500px; }
        .usina-card {
            background: var(--card);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }
        .usina-info h3 { margin: 0; font-size: 1rem; color: var(--primary); }
        .usina-info p { margin: 2px 0; font-size: 0.75rem; opacity: 0.8; }
        .stats { text-align: right; }
        .stats span { display: block; font-size: 0.9rem; font-weight: bold; color: #fbbf24; }
        .stats small { font-size: 0.7rem; opacity: 0.6; }

        .btn-delete { background: #ef4444; color: white; padding: 5px 10px; font-size: 0.7rem; width: auto; margin: 0; }
    </style>
</head>
<body>

    <header>
        <img src="web-app-manifest-192x192.png" alt="Logo">
        <h1>SINERGIA ELÉTRICA</h1>
        <p>Dashboard de Comandos e Usinas</p>
    </header>

    <div class="container">
        <h2>REGISTRAR USINA</h2>
        
        <form id="commandForm">
            <div class="input-group">
                <label>Cliente / Nome da Planta</label>
                <input type="text" id="clientName" required placeholder="Ex: Mercado Central">
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Marca</label>
                    <select id="inverterBrand">
                        <option value="SUNGROW">SUNGROW</option>
                        <option value="GROWATT">GROWATT</option>
                        <option value="WEG">WEG</option>
                        <option value="FOX">FOX ESS</option>
                        <option value="SOLIS">SOLIS</option>
                        <option value="SAJ">SAJ</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Geração (kWh)</label>
                    <input type="number" id="generation" placeholder="0.0">
                </div>
            </div>

            <div class="input-group">
                <label>Tempo de Atividade (Uptime)</label>
                <input type="text" id="uptime" placeholder="Ex: 1200 horas">
            </div>

            <button type="button" class="btn-portal" onclick="abrirPortal()">
                🌐 PORTAL DE MONITORAMENTO
            </button>

            <button type="submit" class="btn-register">
                SALVAR NA LISTA
            </button>
        </form>
    </div>

    <div class="list-container" id="usinaList">
        <h2>USINAS MONITORADAS</h2>
        </div>

    <script>
        const portalLinks = {
            'SUNGROW': 'https://www.isolarcloud.com/',
            'GROWATT': 'https://server.growatt.com/',
            'WEG': 'https://home.v2.weg-v-net.com/',
            'FOX': 'https://www.foxesscloud.com/',
            'SOLIS': 'https://www.soliscloud.com/',
            'SAJ': 'https://www.saj-electric.com/'
        };

        function abrirPortal() {
            const marca = document.getElementById('inverterBrand').value;
            window.open(portalLinks[marca], '_blank');
        }

        // Lógica para Salvar e Exibir Usinas
        const form = document.getElementById('commandForm');
        const list = document.getElementById('usinaList');

        function loadUsinas() {
            const usinas = JSON.parse(localStorage.getItem('usinas') || '[]');
            list.innerHTML = '<h2>USINAS MONITORADAS</h2>';
            usinas.forEach((u, index) => {
                list.innerHTML += `
                    <div class="usina-card">
                        <div class="usina-info">
                            <h3>${u.nome}</h3>
                            <p>Marca: ${u.marca}</p>
                            <button class="btn-delete" onclick="removerUsina(${index})">Excluir</button>
                        </div>
                        <div class="stats">
                            <span>${u.geracao} kWh</span>
                            <small>${u.tempo}</small>
                        </div>
                    </div>
                `;
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const novaUsina = {
                nome: document.getElementById('clientName').value,
                marca: document.getElementById('inverterBrand').value,
                geracao: document.getElementById('generation').value || '0',
                tempo: document.getElementById('uptime').value || 'N/A'
            };

            const usinas = JSON.parse(localStorage.getItem('usinas') || '[]');
            usinas.push(novaUsina);
            localStorage.setItem('usinas', JSON.stringify(usinas));
            form.reset();
            loadUsinas();
        });

        function removerUsina(index) {
            const usinas = JSON.parse(localStorage.getItem('usinas') || '[]');
            usinas.splice(index, 1);
            localStorage.setItem('usinas', JSON.stringify(usinas));
            loadUsinas();
        }

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        loadUsinas();
    </script>
</body>
</html>
