<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC Commands</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #10b981;
            --bg: #0c3328;
            --card: #164235;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        .logo-container img {
            width: 120px;
            margin-bottom: 10px;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h2 { color: var(--primary); font-size: 1.2rem; margin-top: 0; }

        .input-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; font-size: 0.9rem; opacity: 0.8; }

        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #0c3328;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .btn-register { background-color: var(--primary); color: white; }
        .btn-portal { background-color: #3b82f6; color: white; }
        button:active { transform: scale(0.98); }

        .brand-grid {
            display: grid;
            grid-template-columns: repeat(3, 1/3);
            gap: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="web-app-manifest-192x192.png" alt="Logo EC">
        </div>
        <h1>ELECTRICAL COMMANDS</h1>
        <p>Gestão Técnica de Usinas Fotovoltaicas</p>
    </header>

    <div class="container">
        <h2>+ NOVO COMANDO</h2>
        
        <form id="commandForm">
            <div class="input-group">
                <label>Cliente / Usina</label>
                <input type="text" id="clientName" placeholder="Ex: Fazenda Solar X">
            </div>

            <div class="input-group">
                <label>Marca do Inversor</label>
                <select id="inverterBrand">
                    <option value="SUNGROW">SUNGROW</option>
                    <option value="GROWATT">GROWATT</option>
                    <option value="WEG">WEG</option>
                    <option value="FOX">FOX ESS</option>
                    <option value="SOLIS">SOLIS</option>
                    <option value="SAJ">SAJ</option>
                </select>
            </div>

            <div class="input-group">
                <label>Nº de Série (S/N)</label>
                <input type="text" id="serialNumber" placeholder="Número de série do inversor">
            </div>

            <button type="button" class="btn-portal" onclick="abrirPortal()">
                🌐 ABRIR PORTAL DA MARCA
            </button>

            <button type="submit" class="btn-register">
                REGISTRAR NO SISTEMA
            </button>
        </form>
    </div>

    <script>
        // Configuração dos Portais de Monitoramento
        const portalLinks = {
            'SUNGROW': 'https://www.isolarcloud.com/',
            'GROWATT': 'https://server.growatt.com/',
            'WEG': 'https://home.v2.weg-v-net.com/',
            'FOX': 'https://www.foxesscloud.com/',
            'SOLIS': 'https://www.soliscloud.com/',
            'SAJ': 'https://www.saj-electric.com/'
        };

        function abrirPortal() {
            const marca = document.getElementById('inverterBrand').value;
            const link = portalLinks[marca];
            
            if (link) {
                window.open(link, '_blank');
            }
        }

        // Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker Ativo"));
        }

        document.getElementById('commandForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Sistema registrado com sucesso!");
        });
    </script>
</body>
</html>
